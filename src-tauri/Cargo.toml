[package]
name = "notor"
version = "0.1.0"
description = "Minimal macOS note-taking & PKM app"
authors = ["Notor Contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "notor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.1", features = ["protocol-asset", "macos-private-api"] }
tauri-plugin-fs = "2.0"
tauri-plugin-shell = "2.0"
tauri-plugin-store = "2.1"
tauri-plugin-dialog = "2.0"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Error handling
thiserror = "1"
anyhow = "1"

# Filesystem
notify = { version = "6.1", features = ["macos_fsevent"] }
walkdir = "2.5"
tempfile = "3.13"
dunce = "1"

# Time
chrono = { version = "0.4", features = ["serde"] }

# IDs
nanoid = "0.4"

# Hashing (for stable IDs from paths)
sha2 = "0.10"

# Async
tokio = { version = "1", features = ["sync", "fs", "rt-multi-thread", "macros", "time"] }

# Logging
log = "0.4"
env_logger = "0.11"

# Concurrency
parking_lot = "0.12"

# Markdown front matter
gray_matter = "0.2"

# Regex (search highlighting)
regex = "1.11"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
